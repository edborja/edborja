  - name: Generate pacman-contribution-graph.svg
    uses: abozanona/pacman-contribution-graph@main
    with:
      github_user_name: ${{ github.repository_owner }}

  - id: collect
    name: Ensure dist dir and collect generated svgs
    run: |
      set -e
      mkdir -p dist
      found=false
      # find SVG files (limit depth) and copy into dist
      while IFS= read -r -d '' f; do
        echo "Found SVG: $f"
        cp -f "$f" dist/ || true
        found=true
      done < <(find . -maxdepth 6 -type f -iname '*.svg' -print0 || true)
      echo "Copied any found SVGs into dist"
      echo "has_svgs=$found" >> $GITHUB_OUTPUT

  - name: List generated files (debug)
    run: |
      echo "Repo root listing:"
      ls -la
      echo "dist listing:"
      ls -la dist || true
      echo "Files copied into dist (names):"
      for f in dist/*; do echo "$f"; done || true

  - name: Skip publish if no svgs found
    if: steps.collect.outputs.has_svgs != 'true'
    run: |
      echo "No SVGs found; skipping publish step."
      exit 0

  - name: Push pacman-contribution-graph.svg to the output branch
    if: steps.collect.outputs.has_svgs == 'true'
    uses: crazy-max/ghaction-github-pages@v3.1.0
    with:
      target_branch: output
      build_dir: dist
      github_token: ${{ secrets.GITHUB_TOKEN }}
